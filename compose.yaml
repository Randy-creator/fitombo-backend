services:
  postgres:
    image: postgres:16-alpine
    container_name: fitombo-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    ports:
      # Exposé uniquement sur ta machine (pas sur le réseau local).
      # Port hôte 5433 par défaut pour ne pas entrer en conflit avec un PostgreSQL local sur 5432.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - fitombo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fitombo-pgdata:
