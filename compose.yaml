services:
  postgres:
    image: postgres:16-alpine
    container_name: fitombo-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME manquant dans .env}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME manquant dans .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fitombo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fitombo-pgdata: