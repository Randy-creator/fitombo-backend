spring.application.name=fitombo

# Profil actif par défaut : dev. En production : SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# Charge un fichier .env local s'il existe (ignoré par Git, absent en production).
# Format : CLE=valeur, une par ligne, SANS guillemets ni espaces autour du "=".
spring.config.import=classpath:config/persistence.properties,optional:file:.env[.properties]

# Serveur
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/problem+json,text/plain,text/html
# Par défaut, jamais de détails d'erreur vers le client (surchargé en dev)
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

spring.threads.virtual.enabled=true

spring.web.locale=fr

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# JSON
spring.jackson.default-property-inclusion=non_null
spring.data.web.pageable.max-page-size=100

# JWT, limitation des tentatives et CORS
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-token-ttl=PT30M
app.security.jwt.refresh-token-ttl=P30D
app.security.login.max-attempts-per-address=10
app.security.login.max-addresses-per-window=10000
app.security.login.window=1m
app.security.jwt.issuer=fitombo
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Inscription SMS
app.security.inscription.duree-code=5m
app.security.inscription.delai-renvoi=1m
app.security.inscription.max-tentatives=5
app.sms.mode=${SMS_MODE:disabled}
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from=${TWILIO_FROM:}

# Actuator : exposition minimale par défaut
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
info.app.name=Fitombo
info.app.version=@project.version@

# Logs
logging.level.root=INFO
logging.level.com.fitombo=INFO
