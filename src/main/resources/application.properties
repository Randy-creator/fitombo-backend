# =====================================================================
# Fitombo - Configuration COMMUNE (versionnée dans Git)
# Fichier : src/main/resources/application.properties
#
# RÈGLES :
#  - Aucun secret ici (mot de passe, clé, token, URL privée).
#  - Les secrets viennent des variables d'environnement, SANS valeur par défaut :
#    si une variable manque, l'application refuse de démarrer (fail fast).
#  - Les réglages propres à un environnement sont dans application-dev.properties
#    et application-prod.properties.
# =====================================================================

spring.application.name=fitombo

# Profil actif par défaut : dev. En production : SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# Charge un fichier .env local s'il existe (ignoré par Git, absent en production).
# Format : CLE=valeur, une par ligne, SANS guillemets ni espaces autour du "=".
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------------
# Serveur
# ---------------------------------------------------------------------
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/problem+json,text/plain,text/html
# Par défaut, jamais de détails d'erreur vers le client (surchargé en dev)
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

spring.threads.virtual.enabled=true

spring.web.locale=fr
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ---------------------------------------------------------------------
# Base de données : valeurs OBLIGATOIRES via variables d'environnement
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ---------------------------------------------------------------------
# JPA / Hibernate : le schéma est géré uniquement par Flyway
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=32

# ---------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# ---------------------------------------------------------------------
# JSON
# ---------------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null

# ---------------------------------------------------------------------
# Paramètres applicatifs (JWT, CORS) : le secret est OBLIGATOIRE, sans valeur par défaut
# ---------------------------------------------------------------------
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-token-ttl=PT30M
app.security.jwt.refresh-token-ttl=P30D
app.security.jwt.issuer=fitombo
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ---------------------------------------------------------------------
# Actuator : exposition minimale par défaut
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
info.app.name=Fitombo
info.app.version=@project.version@

# ---------------------------------------------------------------------
# Logs
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.fitombo=INFO