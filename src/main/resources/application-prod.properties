# =====================================================================
# Fitombo - Profil PROD (versionné dans Git, sans secret)
# Fichier : src/main/resources/application-prod.properties
# Activation : SPRING_PROFILES_ACTIVE=prod
# Les variables DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET et CORS_ALLOWED_ORIGINS
# sont fournies par la plateforme d'hébergement (variables d'environnement ou coffre de secrets).
# =====================================================================

# Pas de démarrage automatique de conteneurs en production
spring.docker.compose.enabled=false

# Aucune information interne vers les clients
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Documentation API désactivée (ou à protéger derrière une authentification admin)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator minimal ; idéalement sur un port interne non exposé à Internet
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# management.server.port=8081

# Taille de pool à ajuster selon le serveur PostgreSQL
spring.datasource.hikari.maximum-pool-size=20

# Cookies et en-têtes derrière un reverse proxy HTTPS (Nginx, Caddy...)
server.forward-headers-strategy=framework

logging.level.root=WARN
logging.level.com.fitombo=INFO