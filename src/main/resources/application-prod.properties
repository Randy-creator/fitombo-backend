# Pas de démarrage automatique de conteneurs en production
spring.docker.compose.enabled=false

# Aucune information interne vers les clients
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Documentation API désactivée
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator minimal ; idéalement sur un port interne non exposé à Internet
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Taille de pool à ajuster selon le serveur PostgreSQL
spring.datasource.hikari.maximum-pool-size=20

# Cookies et en-têtes derrière un reverse proxy HTTPS (Nginx, Caddy...)
server.forward-headers-strategy=framework

logging.level.root=WARN
logging.level.com.fitombo=INFO
