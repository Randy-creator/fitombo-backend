# =====================================================================
# Fitombo - Profil DEV (versionné dans Git, sans secret)
# Fichier : src/main/resources/application-dev.properties
# =====================================================================

# Docker Compose Support : démarre le PostgreSQL de compose.yaml.
# Mets enabled=false si tu utilises un PostgreSQL installé sur ta machine.
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:true}
spring.docker.compose.file=compose.yaml
spring.docker.compose.lifecycle-management=start_only

# Détails d'erreur visibles pour déboguer (jamais en production)
server.error.include-message=always
server.error.include-binding-errors=always

# SQL lisible pour comprendre ce que fait Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# Actuator plus détaillé en local
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Swagger UI : http://localhost:8080/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

logging.level.com.fitombo=DEBUG
